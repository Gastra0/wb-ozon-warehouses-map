name: Test rsshub
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - run: python3 scripts/test_rsshub.py
      - run: |
          git config user.name "test-bot"
          git config user.email "test@bot"
          git add rsshub_test.txt
          git diff --cached --quiet || git commit -m "test: rsshub results" && git push
