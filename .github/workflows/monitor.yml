name: WB Warehouse Monitor

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Run monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/monitor.py > monitor_debug.log 2>&1
        continue-on-error: true

      - name: Commit log and results
        run: |
          echo "=== monitor_debug.log ==="
          cat monitor_debug.log
          git config user.name  "WB-Monitor Bot"
          git config user.email "wb-monitor@github-actions"
          git add -A
          git diff --cached --quiet && echo "Nothing to commit" || (
            git commit -m "🤖 $(date -u +'%Y-%m-%d %H:%M UTC') — see monitor_debug.log"
            git push
          )
