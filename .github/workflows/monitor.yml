name: WB Warehouse Monitor

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Run monitor (capture output)
        id: monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/monitor.py > monitor_debug.log 2>&1
        continue-on-error: true

      - name: Show output and decide
        run: |
          echo "=== monitor output ==="
          cat monitor_debug.log
          echo "=== exit ==="
          grep -q "Done ✓\|No new articles" monitor_debug.log && echo "SUCCESS" || (echo "FAILURE"; exit 1)

      - name: Commit results
        run: |
          git config user.name  "WB-Monitor Bot"
          git config user.email "wb-monitor@github-actions"
          git add -A
          git diff --cached --quiet && echo "No changes" || (
            git commit -m "🤖 Auto-update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          )
