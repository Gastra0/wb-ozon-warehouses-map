name: WB Warehouse Monitor

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Run monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          python3 scripts/monitor.py 2>&1 | tee /tmp/monitor_output.txt
          exit ${PIPESTATUS[0]}

      - name: Upload monitor log on failure
        if: failure()
        run: cat /tmp/monitor_output.txt || echo "no output"

      - name: Commit and push if changed
        run: |
          git config user.name  "WB-Monitor Bot"
          git config user.email "wb-monitor@github-actions"
          git add -A
          git diff --cached --quiet && echo "No changes" || (
            git commit -m "🤖 Auto-update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          )
