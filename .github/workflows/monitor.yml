name: WB Warehouse Monitor

on:
  schedule:
    - cron: '0 5 * * *'   # 08:00 Kyiv / 07:00 Moscow щодня
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Run monitor and update map
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/monitor.py

      - name: Commit and push if changed
        run: |
          git config user.name  "WB-Monitor Bot"
          git config user.email "wb-monitor@github-actions"
          git add -A
          git diff --cached --quiet && echo "No changes" || (
            git commit -m "🤖 Auto-update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          )
